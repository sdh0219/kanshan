<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1220"/><stop offset="0.65" stop-color="#131b2c"/><stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a24c" stop-opacity="0.9"/><stop offset="1" stop-color="#d4a24c" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#hall)"/>
  <!-- 走廊透视 -->
  <polygon points="0,360 240,120 400,120 640,360" fill="#0e1526"/>
  <polygon points="240,120 400,120 400,60 240,60" fill="#111a2e"/>
  <line x1="320" y1="60" x2="320" y2="360" stroke="#232a3b" stroke-width="2"/>
  <!-- 六扇门：第五扇微开 -->
  <g fill="#1a2438" stroke="#2a3245" stroke-width="2">
    <rect x="40" y="150" width="70" height="180"/>
    <rect x="150" y="130" width="80" height="210"/>
    <rect x="410" y="130" width="80" height="210"/>
    <rect x="530" y="150" width="70" height="180"/>
  </g>
  <g fill="#1a2438" stroke="#2a3245" stroke-width="2">
    <rect x="272" y="118" width="42" height="230"/>
    <rect x="326" y="118" width="42" height="230"/>
  </g>
  <!-- 微开的那扇（第31位住客） -->
  <polygon points="326,118 348,128 348,348 326,348" fill="#233252"/>
  <polygon points="348,124 396,150 396,360 348,348" fill="#060a12"/>
  <ellipse cx="376" cy="300" rx="52" ry="14" fill="#d4a24c" opacity="0.10"/>
  <!-- 门缝金光 -->
  <line x1="348" y1="128" x2="348" y2="348" stroke="#d4a24c" stroke-width="2.5" opacity="0.9"/>
  <ellipse cx="348" cy="200" rx="16" ry="90" fill="url(#glow)" opacity="0.5"/>
  <!-- 吊灯 -->
  <line x1="320" y1="0" x2="320" y2="46" stroke="#3d5a7a" stroke-width="2"/>
  <circle cx="320" cy="54" r="7" fill="#d4a24c" opacity="0.9"/>
  <circle cx="320" cy="54" r="18" fill="#d4a24c" opacity="0.12"/>
  <circle cx="320" cy="54" r="34" fill="#d4a24c" opacity="0.05"/>
  <!-- 门牌 30/31 -->
  <g font-family="monospace" font-size="12" fill="#5a6478" text-anchor="middle">
    <text x="293" y="112">30</text><text x="347" y="112">31</text>
  </g>
  <rect width="640" height="360" fill="#0a0c10" opacity="0.22" filter="url(#grain)"/>
</svg>
